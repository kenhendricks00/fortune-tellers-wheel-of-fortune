<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of Fortune</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #1a237e, #0d0d2b);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    h1 {
      margin: 16px 0 0;
      color: #ffd54f;
    }

    #wheel {
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 24px;
    }

    #spin-button {
      font-size: 24px;
      font-weight: bold;
      padding: 12px 48px;
      border: none;
      border-radius: 8px;
      background: #ffd54f;
      color: #1a237e;
      cursor: pointer;
    }

    #spin-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #result {
      font-size: 28px;
      font-weight: bold;
      min-height: 34px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <h1>Wheel of Fortune</h1>
  <div id="wheel"></div>
  <div id="controls">
    <button id="spin-button">Spin</button>
    <div id="result"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
